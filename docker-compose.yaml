version: '3.9'

# Local Postgres only. Run the Nest API with pnpm (DB_HOST=localhost).
# Shared with cs_i18n_service (and other local CraftScript containers).
# Create once: docker network create cs-network
networks:
  cs-network:
    external: true
    name: cs-network

services:
  db:
    image: ${DB_CLIENT}
    container_name: db_cs
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - pg-db:/var/lib/postgres/data
    networks:
      - cs-network

volumes:
  pg-db:
